<!doctype html>
<!-- @dsCard group="Type" name="Type Scale" subtitle="11 steps · 11px → 88px · 2xs is mono caps only" viewport="700x300" -->
<html data-theme="graphite">
<head>
<meta charset="utf-8">
<title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { padding: 18px 22px; display: flex; flex-direction: column; gap: 6px; }
  .tag { font-family: var(--font-ui); font-size: var(--text-2xs); color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: 60px 60px 1fr; align-items: baseline; gap: 14px; padding: 2px 0; border-bottom: 1px solid var(--border-color); }
  .k { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--accent-text); }
  .px { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-muted); text-align: right; }
  .sp { font-family: var(--font-display); color: var(--text-primary); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp.read { font-family: var(--font-body); font-weight: var(--body-weight); line-height: 1.2; }
  .sp.caps { font-family: var(--font-ui); letter-spacing: var(--tracking-caps); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="tag">Type scale · 11 steps · 11px → 88px · base / body / lg in Literata</div>
  <div class="row"><span class="k">2xs</span><span class="px">11px</span><span class="sp caps" style="font-size:var(--text-2xs)">Atlas Meridia · labels only</span></div>
  <div class="row"><span class="k">xs</span><span class="px">12px</span><span class="sp" style="font-size:12px">Atlas Meridia</span></div>
  <div class="row"><span class="k">sm</span><span class="px">14px</span><span class="sp" style="font-size:14px">Atlas Meridia</span></div>
  <div class="row"><span class="k">base</span><span class="px">18px</span><span class="sp read" style="font-size:18px">Atlas Meridia · UI text</span></div>
  <div class="row"><span class="k">body</span><span class="px">20px</span><span class="sp read" style="font-size:20px">Atlas Meridia · reading</span></div>
  <div class="row"><span class="k">lg</span><span class="px">24px</span><span class="sp read" style="font-size:24px">Atlas Meridia · lead</span></div>
  <div class="row"><span class="k">xl</span><span class="px">28px</span><span class="sp" style="font-size:28px">Atlas Meridia</span></div>
  <div class="row"><span class="k">2xl</span><span class="px">36px</span><span class="sp" style="font-size:36px">Atlas Meridia</span></div>
  <div class="row"><span class="k">3xl</span><span class="px">48px</span><span class="sp" style="font-size:48px">Atlas</span></div>
</body>
</html>
