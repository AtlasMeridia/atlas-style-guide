<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Square corners · mono caps · invert-on-hover" viewport="700x280" -->
<html>
<head>
<meta charset="utf-8">
<title>Minerali — buttons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07080a; color: #e6ddc8; font-family: 'JetBrains Mono', monospace; }
  body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .slug { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #2be0c8; display: flex; justify-content: space-between; border-bottom: 1px solid #1c1e22; padding-bottom: 8px; }
  .slug .right { color: #b8ad93; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 11px 16px 11px 16px;
    border: 1px solid currentColor; background: transparent; color: #e6ddc8;
    cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
    transition: 120ms ease;
    border-radius: 0;
  }
  .btn:hover { background: #e6ddc8; color: #07080a; }
  .btn .num { color: #2be0c8; font-weight: 400; }
  .btn:hover .num { color: #c75a2a; }
  .btn.acid { background: #2be0c8; color: #07080a; border-color: #2be0c8; }
  .btn.acid .num { color: #3a0f10; }
  .btn.acid:hover { background: #07080a; color: #2be0c8; }
  .btn.danger { color: #c75a2a; }
  .btn.danger:hover { background: #3a0f10; color: #e6ddc8; border-color: #3a0f10; }
  .btn.ghost { color: #b8ad93; border-color: #1c1e22; }
  .btn.ghost:hover { color: #e6ddc8; border-color: #e6ddc8; background: transparent; }
  .spec { font-size: 10px; color: #b8ad93; letter-spacing: 0.12em; text-transform: uppercase; border-top: 1px solid #1c1e22; padding-top: 10px; margin-top: 4px; }
  .spec b { color: #e6ddc8; font-weight: 400; }
</style>
</head>
<body>
  <div class="slug"><span>MINERALI · 05 · BUTTONS</span><span class="right">square corners · mono caps</span></div>
  <div class="row">
    <button class="btn acid"><span class="num">01</span>Execute</button>
    <button class="btn"><span class="num">02</span>Continue</button>
    <button class="btn ghost"><span class="num">03</span>Cancel</button>
    <button class="btn danger"><span class="num">04</span>Delete forever</button>
  </div>
  <div class="row">
    <button class="btn acid">Sign commit →</button>
    <button class="btn">Dry run</button>
    <button class="btn ghost">Discard</button>
  </div>
  <div class="spec">no radius · <b>1px border</b> · mono 700 <b>+0.14em</b> · hover <b>inverts ground</b></div>
</body>
</html>
