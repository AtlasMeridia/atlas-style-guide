<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Square corners · mono caps · invert-on-hover · one acid per surface" viewport="700x280" -->
<html>
<head>
<meta charset="utf-8">
<title>Minerali — buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .num { color: var(--text-muted); font-weight: 400; }
  .mn-btn:hover .num { color: inherit; }
  .spec { font-family: var(--font-ui); font-size: var(--text-2xs); color: var(--text-secondary); letter-spacing: 0.12em; text-transform: uppercase; border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 4px; }
  .spec b { color: var(--text-primary); font-weight: 400; }
</style>
</head>
<body class="mn-chrome">
  <div class="mn-slug"><span><span class="glyph">▚</span> minerali · 05 · buttons</span><span class="right">square corners · mono caps</span></div>
  <div class="row">
    <button class="mn-btn acid">Execute</button>
    <button class="mn-btn"><span class="num">02</span>Continue</button>
    <button class="mn-btn ghost"><span class="num">03</span>Cancel</button>
    <button class="mn-btn danger"><span class="num">04</span>Delete forever</button>
  </div>
  <div class="row">
    <button class="mn-btn">Sign commit</button>
    <button class="mn-btn">Dry run</button>
    <button class="mn-btn ghost">Discard</button>
  </div>
  <div class="spec">no radius · <b>1px border</b> · mono 700 <b>+0.14em</b> · hover <b>inverts ground</b> · <b>one acid</b> per surface</div>
</body>
</html>
