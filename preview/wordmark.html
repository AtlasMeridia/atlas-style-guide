<!doctype html>
<!-- @dsCard group="Brand" name="Wordmark" subtitle="ATLAS / Product · acid slash · wonk italic" viewport="700x300" -->
<html>
<head>
<meta charset="utf-8">
<title>Minerali — wordmark</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07080a; color: #e6ddc8; }
  body { padding: 26px; display: flex; flex-direction: column; gap: 18px; font-family: 'JetBrains Mono', monospace; }
  .slug { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #b8ad93; display: flex; justify-content: space-between; border-bottom: 1px solid #1c1e22; padding-bottom: 8px; }
  .slug .right { color: #90887c; }
  .mark {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'WONK' 1;
    display: flex; align-items: baseline; gap: 0.12em;
    line-height: 1;
  }
  .mark .a {
    font-size: 24px; font-style: normal; font-weight: 400;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #b8ad93;
  }
  .slash { color: #2be0c8; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 24px; }
  .mark .b {
    font-size: 56px; font-style: italic; font-weight: 900;
    letter-spacing: -0.035em; color: #e6ddc8;
  }
  .mark.acid .b { color: #2be0c8; }
  .mark.rust .b { color: #c75a2a; }
  .spec { font-size: 11px; color: #b8ad93; letter-spacing: 0.12em; text-transform: uppercase; border-top: 1px solid #1c1e22; padding-top: 8px; }
  .spec b { color: #e6ddc8; font-weight: 400; }
</style>
</head>
<body>
  <div class="slug"><span>MINERALI · 04 · WORDMARK</span><span class="right">caps / slash / wonk italic</span></div>
  <div class="mark"><span class="a">ATLAS</span><span class="slash">/</span><span class="b">Meridia</span></div>
  <div class="mark acid"><span class="a">ATLAS</span><span class="slash">/</span><span class="b">Hermes</span></div>
  <div class="mark rust"><span class="a">ATLAS</span><span class="slash">/</span><span class="b">Aeon</span></div>
  <div class="spec">ATLAS · <b>caps 400 · +0.18em</b> &nbsp; SLASH · <b>acid, mono 700</b> &nbsp; PRODUCT · <b>Fraunces italic 900 wonk</b></div>
</body>
</html>
