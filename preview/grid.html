<!doctype html>
<!-- @dsCard group="Spacing" name="Grid" subtitle="12-col hairline grid with reserved block" viewport="800x520" -->
<html data-theme="graphite">
<head>
<meta charset="utf-8">
<title>Minerali — grid & hairline</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--mn-ink); color: var(--mn-paper); font-family: var(--font-mono); }
  body { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .stage {
    flex: 1; position: relative; border: 1px solid var(--mn-hairline);
    background:
      repeating-linear-gradient(to right, transparent 0 calc(100%/12 - 1px), var(--mn-hairline) calc(100%/12 - 1px) calc(100%/12)),
      repeating-linear-gradient(to bottom, transparent 0 47px, var(--mn-hairline) 47px 48px);
  }
  .corner { position: absolute; width: 10px; height: 10px; }
  .c1 { top: -1px; left: -1px; border-top: 1px solid var(--mn-acid); border-left: 1px solid var(--mn-acid); }
  .c2 { top: -1px; right: -1px; border-top: 1px solid var(--mn-acid); border-right: 1px solid var(--mn-acid); }
  .c3 { bottom: -1px; left: -1px; border-bottom: 1px solid var(--mn-acid); border-left: 1px solid var(--mn-acid); }
  .c4 { bottom: -1px; right: -1px; border-bottom: 1px solid var(--mn-acid); border-right: 1px solid var(--mn-acid); }

  .markers { position: absolute; inset: 0; padding: 14px; display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mn-muted); pointer-events: none; }
  .cols { position: absolute; top: 14px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 0; font-size: 9px; letter-spacing: 0.1em; color: var(--mn-muted); }
  .cols span { padding: 0 4px; border-right: 1px solid var(--mn-hairline); }
  .cols span:first-child { color: var(--mn-acid); }
  .cols span:last-child { border-right: 0; }

  .block {
    position: absolute; top: 72px; left: calc(100%/12 + 14px); width: calc(100%/12 * 5);
    border: 1px solid var(--mn-paper); padding: 14px 16px; background: var(--mn-ink-2);
  }
  .block h {
    display: block;
    font-family: var(--font-display); font-variation-settings: 'opsz' 144, 'WONK' 1;
    font-weight: 900; font-style: italic; font-size: 34px; line-height: 0.9;
    letter-spacing: -0.03em; color: var(--mn-paper);
  }
  .block h em { color: var(--mn-acid); }
  .block p { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mn-bone); margin: 10px 0 0; }

  .ghost {
    position: absolute; top: 72px; right: 14px;
    width: calc(100%/12 * 3); height: 180px;
    border: 1px dashed var(--mn-rust); display: flex; align-items: center; justify-content: center;
    color: var(--mn-rust); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .ghost::before, .ghost::after {
    content: ''; position: absolute; background: var(--mn-rust);
  }
  .ghost::before { inset: 0; clip-path: polygon(0 0, 100% 0, 100% 1px, 0 1px); }

  .caption {
    position: absolute; left: 14px; bottom: 14px; right: 14px;
    display: flex; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mn-bone);
  }
  .caption .acid { color: var(--mn-acid); }
  .caption .rust { color: var(--mn-rust); }
  .measure {
    position: absolute; bottom: 58px; left: 14px; right: 14px; height: 16px;
    display: flex; align-items: center; font-size: 9px; letter-spacing: 0.15em; color: var(--mn-muted); text-transform: uppercase;
  }
  .measure .bar { flex: 1; height: 1px; background: var(--mn-acid); margin: 0 8px; }
</style>
</head>
<body>
  <div class="mn-slug"><span>MINERALI · 07 · GRID</span><span class="right">12 col · 48px baseline · 14px gutter</span></div>
  <div class="stage">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <div class="markers"><span>00 · top-left</span><span>∴ 1440 × 900</span></div>
    <div class="cols">
      <span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span>
      <span>07</span><span>08</span><span>09</span><span>10</span><span>11</span><span>12</span>
    </div>

    <div class="block">
      <span class="h">Structure<br>before <em>style</em>.</span>
      <p>col 02 · span 5 · baseline 4</p>
    </div>

    <div class="ghost">RESERVED · 3col × 180</div>

    <div class="measure">
      <span>col 02</span><div class="bar"></div><span>span 5</span>
    </div>
    <div class="caption">
      <span><span class="acid">▚</span> grid is a load-bearing wall, not a suggestion</span>
      <span class="rust">· never center what should hang</span>
    </div>
  </div>
</body>
</html>
